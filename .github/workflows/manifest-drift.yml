name: Manifest Drift Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-manifest:
    name: check-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run manifest drift check
        run: python .github/scripts/check_manifest_drift.py
